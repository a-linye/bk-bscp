#!/usr/bin/env python
# -*- coding: utf-8 -*-

from __future__ import print_function  # 使print函数在Python 2中可用
import requests
import json
import os
import sys

# 检查Python版本
PY2 = sys.version_info[0] == 2

# 设置参数
feed_addr = "{{ .Bk_Bscp_Variable_FEED_ADDR }}"
biz_id = {{ .Bk_Bscp_Variable_BkBizId }}
service_name = "{{ .Bk_Bscp_Variable_ServiceName }}"
file_path = {{ .Bk_Bscp_Variable_KeyName }}
token = {{ .Bk_Bscp_Variable_ClientKey }}
labels = {{ .Bk_Bscp_Variable_Leabels }}
# 项目 key，可选；请赋值为服务所属项目的实际项目 key，不填写时服务端回退到默认项目
project_key = "{{ .Bk_Bscp_Variable_ProjectKey }}"
# 环境名称，可选；请赋值为服务所属环境的实际环境名称，不填写时服务端回退到默认环境
env_name = "{{ .Bk_Bscp_Variable_EnvName }}"
save_path = './'

# 使用参数构建URL
url = "{}/api/v1/feed/biz/{}/projects/{}/envs/{}/app/{}/files{}".format(
    feed_addr, biz_id, project_key, env_name, service_name, file_path)

# 设置请求头，包括Authorization token
headers = {
    "Authorization": "Bearer {}".format(token),
}

# 设置请求参数
params = {
    "labels": json.dumps(labels)
} 

# 发送 GET 请求下载文件(以标准输出在终端打印显示）
response = requests.get(url, params=params, headers=headers)

# 统一输出内容
content = response.content.decode('utf-8') if not PY2 else response.content
print("Response content:", content)

